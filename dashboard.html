<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到 · 燕云摸鱼办</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimSun', 'STSong', serif;
            background: #362b22;
            color: #d4c9a8;
            line-height: 1.8;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #362b22; }
        ::-webkit-scrollbar-thumb { background: #8b7355; border-radius: 3px; }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(139,115,85,0.15);
        }
        .top-bar .logo { font-size: 1.1rem; color: #d4c9a8; }
        .top-bar .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .top-bar .nav-links a {
            color: #8b7355; text-decoration: none; font-size: 0.85rem;
            transition: color 0.2s;
        }
        .top-bar .nav-links a:hover { color: #d4c9a8; }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* User header card */
        .user-card {
            background: linear-gradient(135deg, #44382c, #2d241c);
            border: 1px solid rgba(139,115,85,0.2);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .user-card .avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: #2d241c;
            border: 2px solid rgba(139,115,85,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        .user-card .info { flex: 1; }
        .user-card .info .name { font-size: 1.2rem; color: #d4c9a8; }
        .user-card .info .level { font-size: 0.8rem; color: #8b7355; margin-top: 2px; }
        .user-card .info .xp-text { font-size: 0.75rem; color: #6b5d4a; margin-top: 2px; }
        .user-card .stats {
            text-align: right;
            flex-shrink: 0;
        }
        .user-card .stats .num { font-size: 1.5rem; color: #d4c9a8; }
        .user-card .stats .label { font-size: 0.7rem; color: #6b5d4a; }

        /* Sections */
        .section-card {
            background: rgba(26,21,16,0.3);
            border: 1px solid rgba(139,115,85,0.12);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .section-title {
            font-size: 1rem;
            color: #d4c9a8;
            margin-bottom: 1rem;
            border-left: 3px solid rgba(139,115,85,0.4);
            padding-left: 10px;
        }

        /* Check-in button */
        .checkin-area {
            text-align: center;
            padding: 2rem;
        }
        .checkin-btn {
            display: inline-block;
            padding: 1rem 3rem;
            border: 1px solid #8b7355;
            color: #d4c9a8;
            background: transparent;
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            border-radius: 4px;
        }
        .checkin-btn:hover { background: rgba(139,115,85,0.15); }
        .checkin-btn.done {
            background: rgba(139,115,85,0.15);
            color: #6b5d4a;
            cursor: default;
            border-color: rgba(139,115,85,0.2);
        }
        .checkin-btn.done:hover { background: rgba(139,115,85,0.15); }

        .checkin-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #8b7355;
        }
        .checkin-info span { color: #d4c9a8; }

        /* XP Bar */
        .xp-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(26,21,16,0.6);
            border-radius: 5px;
            overflow: hidden;
            margin: 0.5rem 0 0.3rem;
        }
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b7355, #d4c9a8);
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .xp-bar-label {
            font-size: 0.7rem;
            color: #6b5d4a;
            text-align: right;
        }

        /* Streak bonus */
        .streak-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.5rem;
        }
        .streak-item {
            text-align: center;
            padding: 0.5rem;
            border: 1px solid rgba(139,115,85,0.12);
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .streak-item .day { color: #8b7355; }
        .streak-item .bonus { color: #d4c9a8; margin-top: 2px; }
        .streak-item.highlight {
            border-color: rgba(139,115,85,0.4);
            background: rgba(139,115,85,0.08);
        }

        /* Leaderboard */
        .lb-table {
            width: 100%;
            border-collapse: collapse;
        }
        .lb-table th {
            text-align: left;
            font-size: 0.7rem;
            color: #6b5d4a;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid rgba(139,115,85,0.1);
        }
        .lb-table td {
            padding: 0.5rem;
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(139,115,85,0.06);
        }
        .lb-table .rank {
            width: 30px;
            color: #8b7355;
            text-align: center;
        }
        .lb-table .rank.gold { color: #ffd700; }
        .lb-table .rank.silver { color: #c0c0c0; }
        .lb-table .rank.bronze { color: #cd7f32; }
        .lb-table .name-col { color: #d4c9a8; }
        .lb-table .xp-col { color: #8b7355; text-align: right; }
        .lb-table .level-col { color: #6b5d4a; font-size: 0.7rem; }
        .lb-table tr.current-user td {
            background: rgba(139,115,85,0.08);
        }
        .lb-title-tag {
            font-size: 0.7rem;
            color: #ffd700;
            margin-left: 6px;
        }

        /* Level list */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.4rem;
        }
        .level-item {
            padding: 0.5rem 0.7rem;
            border: 1px solid rgba(139,115,85,0.1);
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .level-item .lv-name { color: #d4c9a8; }
        .level-item .lv-range { color: #6b5d4a; font-size: 0.65rem; }
        .level-item.current {
            border-color: rgba(139,115,85,0.4);
            background: rgba(139,115,85,0.1);
        }

        .streak-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }
        .streak-dot {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(139,115,85,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #6b5d4a;
        }
        .streak-dot.active {
            border-color: #8b7355;
            background: rgba(139,115,85,0.2);
            color: #d4c9a8;
        }
        .streak-dot.bonus {
            border-color: #d4c9a8;
            background: rgba(212,201,168,0.15);
            color: #d4c9a8;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #44382c, #55483a);
            border: 1px solid rgba(139,115,85,0.3);
            border-radius: 8px;
            padding: 1rem 2rem;
            color: #d4c9a8;
            font-size: 0.9rem;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-align: center;
        }
        .toast.show { opacity: 1; }
        .toast .big { font-size: 1.5rem; display: block; margin-bottom: 4px; }

        .back-btn {
            display: inline-block;
            color: #8b7355;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #d4c9a8; }
    </style>
</head>
<body>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="https://maodemon.github.io/yyshimen/" class="back-btn">← 返回首页</a>
        <div class="logo">🐟 燕云摸鱼办 · 签到</div>
        <ul class="nav-links">
            <li><a href="https://maodemon.github.io/yyshimen/#intro">师门</a></li>
            <li><a href="https://maodemon.github.io/yyshimen/#members">门人</a></li>
            <li><a href="https://maodemon.github.io/yyshimen/#skills">功法</a></li>
        </ul>
    </div>

    <div class="container" id="app">

        <!-- User card -->
        <div class="user-card" id="userCard">
            <div class="avatar" id="userAvatar">🎭</div>
            <div class="info">
                <div class="name" id="userName">加载中...</div>
                <div class="level" id="userLevel">-</div>
                <div class="xp-text" id="userXpText">经验: 0</div>
            </div>
            <div class="stats">
                <div class="num" id="streakNum">0</div>
                <div class="label">连续签到</div>
            </div>
        </div>

        <!-- Check-in -->
        <div class="section-card">
            <div class="checkin-area">
                <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">📌 签 到</button>
                <div class="checkin-info">
                    <div>今日已签: <span id="todayDone">否</span></div>
                    <div>本周签到: <span id="weekCount">0</span>/7 天</div>
                </div>
            </div>
        </div>

        <!-- XP Bar -->
        <div class="section-card">
            <div class="section-title">经验进度</div>
            <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:#6b5d4a;">
                <span id="currentLevelName">-</span>
                <span id="nextLevelName">-</span>
            </div>
            <div class="xp-bar-bg">
                <div class="xp-bar-fill" id="xpBar" style="width:0%"></div>
            </div>
            <div class="xp-bar-label" id="xpBarLabel">0 / 0</div>
        </div>

        <!-- 7-day streak bar -->
        <div class="section-card">
            <div class="section-title">本周签到进度</div>
            <div class="streak-bar" id="weekStreak"></div>
        </div>

        <!-- Streak Bonus -->
        <div class="section-card">
            <div class="section-title">连续签到奖励</div>
            <div class="streak-grid" id="streakBonusGrid"></div>
        </div>

        <!-- Leaderboard -->
        <div class="section-card" id="lbSection">
            <div class="section-title">🐟 摸鱼王者周榜 <span style="font-size:0.65rem;color:#6b5d4a;">满7天获「一周鱼王」称号(+30XP)</span></div>
            <table class="lb-table" id="lbTable">
                <thead><tr><th></th><th>摸鱼仙人</th><th>等级</th><th>经验</th></tr></thead>
                <tbody id="lbBody"></tbody>
            </table>
        </div>

        <!-- All levels -->
        <div class="section-card">
            <div class="section-title">摸鱼等级大全</div>
            <div class="level-grid" id="levelGrid"></div>
        </div>

        <!-- Admin Panel (only visible to admin) -->
        <div class="section-card" id="adminPanel" style="display:none;">
            <div class="section-title">🔑 管理员面板 · 账号管理</div>

            <div style="margin-bottom:1rem;">
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem;">
                    <input type="text" id="adminNewUsername" placeholder="新账号" style="flex:1;min-width:120px;padding:0.6rem 0.8rem;background:rgba(26,21,16,0.4);border:1px solid rgba(139,115,85,0.2);border-radius:4px;color:#d4c9a8;font-family:inherit;outline:none;">
                    <input type="text" id="adminNewNickname" placeholder="昵称" style="flex:1;min-width:120px;padding:0.6rem 0.8rem;background:rgba(26,21,16,0.4);border:1px solid rgba(139,115,85,0.2);border-radius:4px;color:#d4c9a8;font-family:inherit;outline:none;">
                    <input type="password" id="adminNewPassword" placeholder="密码" style="flex:1;min-width:120px;padding:0.6rem 0.8rem;background:rgba(26,21,16,0.4);border:1px solid rgba(139,115,85,0.2);border-radius:4px;color:#d4c9a8;font-family:inherit;outline:none;">
                    <button onclick="adminAddUser()" style="padding:0.6rem 1.2rem;background:#8b7355;border:none;border-radius:4px;color:#fff;cursor:pointer;font-family:inherit;">添加账号</button>
                </div>
                <div id="adminMsg" style="font-size:0.75rem;color:#6b5d4a;min-height:1.2rem;"></div>
            </div>

            <table class="lb-table">
                <thead><tr><th>账号</th><th>昵称</th><th>角色</th><th>经验</th><th>操作</th></tr></thead>
                <tbody id="adminUserList"></tbody>
            </table>
        </div>

    </div>

    <script>
        // ========== Config ==========
        const LEVELS = [
            { name: '摸鱼幼苗', min: 0, max: 20 },
            { name: '键盘养心丸', min: 20, max: 50 },
            { name: '厕所沉思者', min: 50, max: 100 },
            { name: '会议云游仙', min: 100, max: 180 },
            { name: '拖延圣体', min: 180, max: 280 },
            { name: '糊弄学硕士', min: 280, max: 400 },
            { name: '带薪光合作用', min: 400, max: 550 },
            { name: '假装加班暗卫', min: 550, max: 720 },
            { name: '午睡真君', min: 720, max: 920 },
            { name: '闲散真人(掌门亲传)', min: 920, max: 1150 },
            { name: '时间折叠者', min: 1150, max: 1420 },
            { name: '反内耗天尊', min: 1420, max: 1730 },
            { name: '摸鱼办主任(副)', min: 1730, max: 2080 },
            { name: '云上逍遥客', min: 2080, max: 2480 },
            { name: '飞升真摸鱼圣人', min: 2480, max: 999999 }
        ];
        const STREAK_BONUSES = [
            { day: 3, bonus: 5 },
            { day: 5, bonus: 10 },
            { day: 7, bonus: 15 },
            { day: 10, bonus: 20 },
            { day: 15, bonus: 30 },
            { day: 20, bonus: 40 },
            { day: 30, bonus: 50 }
        ];
        const STORAGE_KEY = 'yyshimen_users';
        const DAILY_XP = 10;
        const WEEKLY_BONUS_XP = 30;

                // ========== Helpers ==========
        function today() {
            return new Date().toISOString().slice(0, 10);
        }
        function getWeekId() {
            const d = new Date();
            const start = new Date(d);
            start.setDate(d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1));
            return start.toISOString().slice(0, 10);
        }
        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem('yyshimen_current_user')); } catch { return null; }
        }

        function getLevel(xp) {
            let lv = LEVELS[0];
            for (const l of LEVELS) { if (xp >= l.min) lv = l; }
            return lv;
        }
        function getLevelIndex(xp) {
            let idx = 0;
            for (let i = 0; i < LEVELS.length; i++) { if (xp >= LEVELS[i].min) idx = i; }
            return idx;
        }

        // ========== GitHub API ==========
        const GITHUB_TOKEN = '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';
        const REPO_OWNER = 'maodemon';
        const REPO_NAME = 'yyshimen';
        const FILE_PATH = 'data/users.json';
        const RAW_URL = 'https://raw.githubusercontent.com/' + REPO_OWNER + '/' + REPO_NAME + '/master/' + FILE_PATH;
        const API_URL = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + FILE_PATH;

        var g_Users = [];
        var g_Loading = true;

        
            try {
                const resp = await fetch(RAW_URL + '?t=' + Date.now());
                if (resp.ok) {
                    g_Users = await resp.json();
                } else {
                    g_Users = [];
                }
            } catch (e) {
                g_Users = [];
            }
        async function fetchUsers() {
            try {
                var resp = await fetch(RAW_URL + '?t=' + Date.now());
                if (resp.ok) {
                    g_Users = await resp.json();
                    localStorage.setItem('yyshimen_data_backup', JSON.stringify(g_Users));
                } else {
                    throw new Error('HTTP');
                }
            } catch (e) {
                try {
                    var bk = localStorage.getItem('yyshimen_data_backup');
                    if (bk) { g_Users = JSON.parse(bk); } else { g_Users = []; }
                } catch(e2) { g_Users = []; }
            }
            var hasAdmin = false;
            for (var i = 0; i < g_Users.length; i++) {
                if (g_Users[i].username === 'admin') { hasAdmin = true; break; }
            }
            if (!hasAdmin) {
                g_Users.push({
                    id: 'admin_' + Date.now().toString(36),
                    username: 'admin', password: '123456', nickname: '管理员', avatar: '🔑',
                    role: 'admin', createdAt: new Date().toLocaleString(),
                    xpData: { xp: 0, checkinDates: [], consecutiveDays: 0, lastDate: '', weekCheckins: [], weekId: '' }
                });
            }
            var cu = getCurrentUser();
            if (cu) {
                var found = false;
                for (var i = 0; i < g_Users.length; i++) {
                    if (g_Users[i].id === cu.id) { found = true; break; }
                }
                if (!found) {
                    g_Users.push({
                        id: cu.id, username: cu.username, password: 'local',
                        nickname: cu.nickname || cu.username, avatar: '🎭',
                        role: 'member', createdAt: new Date().toLocaleString(),
                        xpData: { xp: 0, checkinDates: [], consecutiveDays: 0, lastDate: '', weekCheckins: [], weekId: '' }
                    });
                }
            }
            g_Loading = false;
            renderAll();
        }

        async function saveUsersToGitHub() {
            try {
                var sha = '';
                var getResp = await fetch(API_URL, {
                    headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN }
                });
                if (getResp.ok) {
                    var d = await getResp.json();
                    sha = d.sha;
                }
                var enc = [];
                var jsonStr = JSON.stringify(g_Users, null, 2);
                for (var i = 0; i < jsonStr.length; i++) {
                    enc.push(jsonStr.charCodeAt(i));
                }
                var content = btoa(String.fromCharCode.apply(null, enc));
                var putResp = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + GITHUB_TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '签到更新 ' + today(),
                        content: content,
                        sha: sha || undefined
                    })
                });
                if (!putResp.ok) {
                    var errText = await putResp.text();
                    showToast('\u26A0\uFE0F \u6570\u636E\u540C\u6B65\u5931\u8D25\uFF0C\u8BF7\u5237\u65B0\u91CD\u8BD5');
                }
            } catch (e) {
                showToast('\u26A0\uFE0F \u7F51\u7EDC\u5F02\u5E38\uFF0C\u6570\u636E\u53EF\u80FD\u672A\u4FDD\u5B58');
            }
        }

        async function doCheckin() {
            var cu = getCurrentUser();
            if (!cu) { window.location.href = 'https://maodemon.github.io/yyshimen/'; return; }
            var idx = -1;
            for (var i = 0; i < g_Users.length; i++) {
                if (g_Users[i].id === cu.id) { idx = i; break; }
            }
            if (idx === -1) { showToast('账号不存在'); return; }
            var user = g_Users[idx];
            if (!user.xpData) { user.xpData = { xp: 0, checkinDates: [], consecutiveDays: 0, lastDate: '', weekCheckins: [], weekId: '' }; }
            var data = user.xpData;
            var td = today();
            var weekId = getWeekId();
            if (data.checkinDates && data.checkinDates.includes(td)) { showToast('今天已经签到过了'); return; }
            var y = new Date();
            y.setDate(y.getDate() - 1);
            var yStr = y.toISOString().slice(0, 10);
            var streak = data.consecutiveDays || 0;
            if (data.lastDate === yStr) { streak += 1; }
            else if (data.lastDate !== td) { streak = 1; }
            var bonusXp = 0;
            for (var k = 0; k < STREAK_BONUSES.length; k++) {
                if (streak === STREAK_BONUSES[k].day) { bonusXp = STREAK_BONUSES[k].bonus; break; }
            }
            var totalXpGain = DAILY_XP + bonusXp;
            var weekCheckins = data.weekCheckins || [];
            var swId = data.weekId || '';
            if (swId !== weekId) { weekCheckins = []; swId = weekId; }
            if (weekCheckins.indexOf(td) === -1) { weekCheckins.push(td); }
            var weeklyBonus = 0;
            if (weekCheckins.length >= 7 && (!data.weeklyBonusWeek || data.weeklyBonusWeek !== weekId)) {
                weeklyBonus = WEEKLY_BONUS_XP;
                data.weeklyBonusWeek = weekId;
            }
            totalXpGain += weeklyBonus;
            data.xp = (data.xp || 0) + totalXpGain;
            if (!data.checkinDates) data.checkinDates = [];
            data.checkinDates.push(td);
            data.consecutiveDays = streak;
            data.lastDate = td;
            data.weekCheckins = weekCheckins;
            data.weekId = swId;
            g_Users[idx] = user;
            await saveUsersToGitHub();
            var msg = '签到成功！+' + DAILY_XP + '经验';
            if (bonusXp > 0) msg += '<br>连续' + streak + '天 +' + bonusXp + '经验';
            if (weeklyBonus > 0) msg += '<br>一周鱼王 +' + weeklyBonus + '经验';
            showToast(msg);
            renderAll();
        }

        function showToast(msg) {
            var el = document.getElementById('toast');
            el.innerHTML = msg;
            el.classList.add('show');
            setTimeout(function() { el.classList.remove('show'); }, 4000);
        }

        function renderAll() {
            var cu = getCurrentUser();
            if (!cu) {
                document.getElementById('app').innerHTML = '<div class="section-card" style="text-align:center;padding:3rem;"><h2>未登录</h2><p style="color:#6b5d4a;margin-top:1rem;">请先去首页登录～</p><a href="https://maodemon.github.io/yyshimen/" style="display:inline-block;margin-top:1rem;padding:0.7rem 2rem;border:1px solid #8b7355;color:#d4c9a8;text-decoration:none;border-radius:4px;">返回首页</a></div>';
                return;
            }
            if (g_Loading) {
                document.getElementById('userName').textContent = '加载中...';
                return;
            }
            var user = null;
            for (var i = 0; i < g_Users.length; i++) {
                if (g_Users[i].id === cu.id) { user = g_Users[i]; break; }
            }
            if (!user) { showToast('账号不存在，请重新登录'); return; }
            var data = user.xpData || {};
            var xp = data.xp || 0;
            var level = getLevel(xp);
            var lvIdx = getLevelIndex(xp);
            var td = today();
            var checkedIn = data.checkinDates ? data.checkinDates.indexOf(td) !== -1 : false;
            var streak = data.consecutiveDays || 0;

            document.getElementById('userAvatar').textContent = user.avatar || '\uD83C\uDFAD';
            document.getElementById('userName').textContent = user.nickname || user.username;
            document.getElementById('userLevel').textContent = 'Lv.' + (lvIdx + 1) + ' \u00B7 ' + level.name;
            document.getElementById('userXpText').textContent = '\u7ECF\u9A8C: ' + xp;
            document.getElementById('streakNum').textContent = streak;

            var btn = document.getElementById('checkinBtn');
            if (checkedIn) {
                btn.textContent = '\u2705 \u4ECA\u65E5\u5DF2\u7B7E';
                btn.classList.add('done'); btn.disabled = true;
            } else {
                btn.textContent = '\uD83D\uDCCC \u7B7E \u5230';
                btn.classList.remove('done'); btn.disabled = false;
            }
            document.getElementById('todayDone').textContent = checkedIn ? '\u662F \u2705' : '\u5426';

            var nextLv = LEVELS[Math.min(lvIdx + 1, LEVELS.length - 1)];
            var curLv = LEVELS[lvIdx];
            var range = nextLv.max - curLv.min;
            var pct = Math.min((xp - curLv.min) / range * 100, 100);
            document.getElementById('currentLevelName').textContent = curLv.name;
            document.getElementById('nextLevelName').textContent = (lvIdx < LEVELS.length - 1) ? '\u2192 ' + nextLv.name : '\u5DF2\u6EE1\u7EA7';
            document.getElementById('xpBar').style.width = Math.min(pct, 100) + '%';
            document.getElementById('xpBarLabel').textContent = (xp - curLv.min) + ' / ' + range + ' XP';

            var weekId = getWeekId();
            var weekCk = (data.weekId === weekId) ? (data.weekCheckins || []) : [];
            document.getElementById('weekCount').textContent = weekCk.length;

            var wEl = document.getElementById('weekStreak');
            var wDays = ['\u4E00', '\u4E8C', '\u4E09', '\u56DB', '\u4E94', '\u516D', '\u65E5'];
            var wh = '';
            for (var i = 0; i < 7; i++) {
                var d = new Date();
                var s = new Date(d);
                s.setDate(d.getDate() - d.getDay() + 1);
                var ds = new Date(s);
                ds.setDate(s.getDate() + i);
                var dss = ds.toISOString().slice(0, 10);
                var ic = weekCk.indexOf(dss) !== -1;
                wh += '<div class="streak-dot' + (ic ? ' active' : '') + (dss === td ? ' bonus' : '') + '">' + (ic ? '\u2713' : wDays[i]) + '</div>';
            }
            wEl.innerHTML = wh;

            var bEl = document.getElementById('streakBonusGrid');
            var bh = '';
            for (var k = 0; k < STREAK_BONUSES.length; k++) {
                var sb = STREAK_BONUSES[k];
                var ir = streak >= sb.day;
                bh += '<div class="streak-item' + (ir ? ' highlight' : '') + '"><div class="day">\u7B2C' + sb.day + '\u5929</div><div class="bonus">+' + sb.bonus + ' XP</div>' + (ir ? '\u2705' : '');
                if (streak === sb.day - 1) bh += '<div style="font-size:0.6rem;color:#ffd700;">\u2B50 \u660E\u65E5\u8FBE\u6210</div>';
                bh += '</div>';
            }
            bEl.innerHTML = bh;

            var lb = document.getElementById('lbBody');
            if (g_Users.length === 0) {
                lb.innerHTML = '<tr><td colspan="4" style="color:#6b5d4a;text-align:center;padding:1rem;">\u6682\u65E0\u6570\u636E</td></tr>';
            } else {
                var sorted = [];
                for (var i = 0; i < g_Users.length; i++) {
                    var u = g_Users[i];
                    sorted.push({ u: u, xp: (u.xpData && u.xpData.xp) || 0, wc: (u.xpData && u.xpData.weekId === weekId) ? (u.xpData.weekCheckins || []).length : 0 });
                }
                sorted.sort(function(a, b) { return b.xp - a.xp; });
                var lh = '';
                for (var i = 0; i < sorted.length; i++) {
                    var s = sorted[i];
                    var lv = getLevel(s.xp);
                    var isMe = s.u.id === cu.id;
                    var rc = i === 0 ? ' gold' : i === 1 ? ' silver' : i === 2 ? ' bronze' : '';
                    var wf = s.wc >= 7;
                    lh += '<tr' + (isMe ? ' class="current-user"' : '') + '><td class="rank' + rc + '">' + (i + 1) + '</td><td class="name-col">' + (s.u.nickname || s.u.username) + (wf ? '<span class="lb-title-tag">\uD83D\uDC51\u4E00\u5468\u9C7C\u738B</span>' : '') + '</td><td class="level-col">' + lv.name + '</td><td class="xp-col">' + s.xp + ' XP</td></tr>';
                }
                lb.innerHTML = lh;
            }

            var lg = document.getElementById('levelGrid');
            var lvh = '';
            for (var i = 0; i < LEVELS.length; i++) {
                var l = LEVELS[i];
                var ic = i === lvIdx;
                var rs = l.max >= 999999 ? l.min + '+' : l.min + '\uFF5E' + l.max;
                lvh += '<div class="level-item' + (ic ? ' current' : '') + '"><div class="lv-name">' + (ic ? '\u25B6 ' : '') + l.name + '</div><div class="lv-range">' + rs + ' XP</div></div>';
            }
            lg.innerHTML = lvh;
            renderAdminPanel();
        }

        function renderAdminPanel() {
            var cu = getCurrentUser();
            var panel = document.getElementById('adminPanel');
            if (!cu || cu.username !== 'admin') { panel.style.display = 'none'; return; }
            panel.style.display = 'block';
            var tb = document.getElementById('adminUserList');
            var h = '';
            for (var i = 0; i < g_Users.length; i++) {
                var u = g_Users[i];
                var xp = (u.xpData && u.xpData.xp) || 0;
                var ia = u.role === 'admin';
                h += '<tr><td class="name-col">' + u.username + '</td><td class="level-col">' + (u.nickname || u.username) + '</td><td class="level-col">' + (ia ? '\uD83D\uDD11 \u7BA1\u7406\u5458' : '\uD83D\uDC64 \u6210\u5458') + '</td><td class="xp-col">' + xp + ' XP</td><td>' + (ia ? '<span style="color:#6b5d4a;font-size:0.7rem;">\u4E0D\u53EF\u5220\u9664</span>' : '<button onclick="adminDeleteUser(\'' + u.id + '\',\'' + u.username + '\')" style="background:none;border:1px solid #c0392b;color:#c0392b;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:0.7rem;font-family:inherit;">\u5220\u9664</button>') + '</td></tr>';
            }
            tb.innerHTML = h;
        }

        async function adminAddUser() {
            var un = document.getElementById('adminNewUsername').value.trim();
            var nn = document.getElementById('adminNewNickname').value.trim() || un;
            var pw = document.getElementById('adminNewPassword').value.trim();
            var msg = document.getElementById('adminMsg');
            if (!un || !pw) { msg.textContent = '账号和密码不能为空'; msg.style.color = '#c0392b'; return; }
            if (un.length < 2 || un.length > 20) { msg.textContent = '账号长度2-20位'; msg.style.color = '#c0392b'; return; }
            for (var i = 0; i < g_Users.length; i++) {
                if (g_Users[i].username === un) { msg.textContent = '账号已存在'; msg.style.color = '#c0392b'; return; }
            }
            g_Users.push({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                username: un, password: pw, nickname: nn, avatar: '\uD83C\uDFAD', role: 'member',
                createdAt: new Date().toLocaleString(),
                xpData: { xp: 0, checkinDates: [], consecutiveDays: 0, lastDate: '', weekCheckins: [], weekId: '' }
            });
            await saveUsersToGitHub();
            document.getElementById('adminNewUsername').value = '';
            document.getElementById('adminNewNickname').value = '';
            document.getElementById('adminNewPassword').value = '';
            msg.textContent = '✅ ' + un + ' 添加成功'; msg.style.color = '#27ae60';
            renderAll();
        }

        async function adminDeleteUser(uid, un) {
            if (un === 'admin') { document.getElementById('adminMsg').textContent = '不能删除管理员'; document.getElementById('adminMsg').style.color = '#c0392b'; return; }
            if (!confirm('确定删除 "' + un + '" 吗？')) return;
            var newUsers = [];
            for (var i = 0; i < g_Users.length; i++) {
                if (g_Users[i].id !== uid) newUsers.push(g_Users[i]);
            }
            g_Users = newUsers;
            await saveUsersToGitHub();
            document.getElementById('adminMsg').textContent = '✅ ' + un + ' 已删除'; document.getElementById('adminMsg').style.color = '#27ae60';
            renderAll();
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetchUsers();
        });</script></body></html>
